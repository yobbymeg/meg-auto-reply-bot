services:
  - type: web
    name: meg-auto-reply-bot
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ★ AI provider: gemini / openai / groq / deepseek / mistral
      - key: AI_PROVIDER
        value: gemini
      # ★ API key for your chosen AI provider (get one below)
      # Gemini:  https://aistudio.google.com/apikey
      # Groq:    https://console.groq.com (FREE, fastest)
      # OpenAI:  https://platform.openai.com/api-keys
      # DeepSeek: https://platform.deepseek.com (cheapest)
      # Mistral: https://console.mistral.ai
      - key: AI_API_KEY
        sync: false
